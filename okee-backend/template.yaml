AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Serverless backend for Okeechobee App

Globals:
  Api:
    Cors:
      AllowMethods: "'GET,POST,OPTIONS'"
      AllowHeaders: "'Content-Type,Authorization'"
      AllowOrigin: "'*'"

Resources:
  # 1. Festival Data Table (Artists, Stages, POIs)
  FestDataTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: okee-fest-data
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: EntityId
          AttributeType: S
      KeySchema:
        - AttributeName: EntityId
          KeyType: HASH

  # 2. User Data Table (Profiles, Locations, Friends)
  UserDataTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: okee-user-data
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: UserId
          AttributeType: S
      KeySchema:
        - AttributeName: UserId
          KeyType: HASH

  # 3. Lineup Data Table
  OkeeLineupTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      TableName: okee-lineup-data
      PrimaryKey:
        Name: ArtistId
        Type: String

  # 4. Map Reports Table
  OkeeReportsTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      TableName: okee-map-reports
      PrimaryKey:
        Name: ReportId
        Type: String

  # 4b. Public Events Table (One per user limit enforced by UserId PK)
  OkeePublicEventsTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      TableName: okee-public-events
      PrimaryKey:
        Name: UserId
        Type: String
          
  # 5. The API Gateway
  OkeeApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin: "'*'"

  # 6. Spotify OAuth Lambda Function
  SpotifyAuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: spotify_auth.lambda_handler
      Runtime: python3.12
      Policies:
        - SSMParameterReadPolicy:
            ParameterName: SpotifyClientSecret
      Environment:
        Variables:
          SPOTIFY_CLIENT_ID: '{{resolve:ssm:SpotifyClientId}}'
          SPOTIFY_SECRET_NAME: 'SpotifyClientSecret'
      Events:
        AuthRoute:
          Type: Api
          Properties:
            RestApiId: !Ref OkeeApi
            Path: /auth/spotify
            Method: GET

  # 7. Spotify OAuth Callback Function
  SpotifyCallbackFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: spotify_callback.lambda_handler
      Runtime: python3.12
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UserDataTable
        - SSMParameterReadPolicy:
            ParameterName: SpotifyClientSecret
      Environment:
        Variables:
          SPOTIFY_CLIENT_ID: '{{resolve:ssm:SpotifyClientId}}'
          SPOTIFY_SECRET_NAME: 'SpotifyClientSecret'
          FRONTEND_URL: 'http://localhost:5500/'
      Events:
        CallbackRoute:
          Type: Api
          Properties:
            RestApiId: !Ref OkeeApi
            Path: /auth/callback
            Method: GET

  # 8. Location Update Function
  UpdateLocationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: update_location.lambda_handler
      Runtime: python3.12
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UserDataTable
        - DynamoDBCrudPolicy:
            TableName: !Ref FestDataTable
      Events:
        LocationRoute:
          Type: Api
          Properties:
            RestApiId: !Ref OkeeApi
            Path: /location
            Method: POST

  # 9. Get Map Data Function
  GetMapDataFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: get_map_data.lambda_handler
      Runtime: python3.12
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UserDataTable
        - DynamoDBCrudPolicy:
            TableName: !Ref FestDataTable
        - DynamoDBCrudPolicy:
            TableName: !Ref OkeeLineupTable
        - DynamoDBCrudPolicy:
            TableName: !Ref OkeeReportsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref OkeePublicEventsTable
      Events:
        MapDataRoute:
          Type: Api
          Properties:
            RestApiId: !Ref OkeeApi
            Path: /map
            Method: GET

  # 10. Manage Friends Function
  ManageFriendsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: manage_friends.lambda_handler
      Runtime: python3.12
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UserDataTable
      Events:
        FriendsPostRoute:
          Type: Api
          Properties:
            RestApiId: !Ref OkeeApi
            Path: /friends
            Method: POST
        FriendsGetRoute:
          Type: Api
          Properties:
            RestApiId: !Ref OkeeApi
            Path: /friends
            Method: GET

  # 11. Automated Schedule Scraper
  SyncScheduleFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: sync_schedule.lambda_handler
      Runtime: python3.12
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref OkeeLineupTable
      Events:
        ScheduleEvent:
          Type: Schedule
          Properties:
            Schedule: rate(12 hours)

  # 12. SOS Toggle Function
  UpdateSosFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: update_sos.lambda_handler
      Runtime: python3.12
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UserDataTable
      Events:
        SosRoute:
          Type: Api
          Properties:
            RestApiId: !Ref OkeeApi
            Path: /sos
            Method: POST

  # 13. Report Error Function
  ReportErrorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: report_error.lambda_handler
      Runtime: python3.12
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref OkeeReportsTable
      Events:
        ReportRoute:
          Type: Api
          Properties:
            RestApiId: !Ref OkeeApi
            Path: /report
            Method: POST

  # 14. Campsite Management Function
  CampsiteFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: campsite.lambda_handler
      Runtime: python3.12
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UserDataTable
      Events:
        CampsiteApi:
          Type: Api
          Properties:
            RestApiId: !Ref OkeeApi
            Path: /campsite
            Method: POST

  # 14b. Personal Schedule Function
  UpdatePersonalScheduleFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: update_personal_schedule.lambda_handler
      Runtime: python3.12
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UserDataTable
      Events:
        SchedulePostRoute:
          Type: Api
          Properties:
            RestApiId: !Ref OkeeApi
            Path: /schedule
            Method: POST

  # 14c. Manage Public Events Function
  ManagePublicEventsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: manage_public_events.lambda_handler
      Runtime: python3.12
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref OkeePublicEventsTable
      Events:
        PublicEventsPostRoute:
          Type: Api
          Properties:
            RestApiId: !Ref OkeeApi
            Path: /public-events
            Method: POST
        PublicEventsGetRoute:
          Type: Api
          Properties:
            RestApiId: !Ref OkeeApi
            Path: /public-events
            Method: GET

  # 15. Cognito User Pool (The User Database)
  OkeeUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: OkeeUsers
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          RequireUppercase: false

  # 16. Cognito App Client (The Connection)
  OkeeUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: OkeeFrontend
      UserPoolId: !Ref OkeeUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      SupportedIdentityProviders:
        - COGNITO
      AllowedOAuthFlows:
        - implicit
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes:
        - email
        - openid
        - profile
      CallbackURLs:
        - http://localhost:5500/okee-frontend/index.html
        - http://127.0.0.1:5500/okee-frontend/index.html
        - http://localhost:5500/index.html
        - http://127.0.0.1:5500/index.html
        - http://localhost:5500/
        - http://127.0.0.1:5500/
        - http://localhost:5500
        - http://127.0.0.1:5500
        - http://127.0.0.1:5500/okee-frontend/
        - http://localhost:5500/okee-frontend/
        - https://okeecho.be/
        - https://www.okeecho.be/
        - https://okeecho.be/index.html
        - https://www.okeecho.be/index.html
      LogoutURLs:
        - http://localhost:5500/okee-frontend/index.html
        - http://localhost:5500/index.html
        - http://localhost:5500/
        - http://localhost:5500
        - https://okeecho.be/
        - https://www.okeecho.be/
        - https://okeecho.be/index.html
        - https://www.okeecho.be/index.html

  # 17. Hosted UI Domain
  OkeeAuthDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub okee-app-${AWS::AccountId}
      UserPoolId: !Ref OkeeUserPool

  # 18. Auto-Confirm Trigger (No Email Required)
  AutoConfirmFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: auto_confirm.lambda_handler
      Runtime: python3.12
      Events:
        CognitoTrigger:
          Type: Cognito
          Properties:
            Trigger: PreSignUp
            UserPool: !Ref OkeeUserPool

Outputs:
  CognitoDomain:
    Value: !Sub https://okee-app-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com
  CognitoClientId:
    Value: !Ref OkeeUserPoolClient